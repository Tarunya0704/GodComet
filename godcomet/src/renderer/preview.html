<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GodComet Preview - Figma vs Generated</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 span {
      color: #667eea;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .score {
      font-size: 24px;
      font-weight: 700;
    }

    .score.pass {
      color: #10b981;
    }

    .score.fail {
      color: #f59e0b;
    }

    .threshold {
      font-size: 14px;
      color: #9ca3af;
    }

    /* Preview Split View */
    .preview-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .preview-panel:last-child {
      border-right: none;
    }

    .panel-header {
      padding: 12px 20px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
      font-weight: 500;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header .label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-image-container {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
    }

    .preview-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .placeholder {
      color: #6b7280;
      text-align: center;
    }

    .placeholder-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Issues Panel */
    .issues-panel {
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.1);
      max-height: 200px;
      overflow-y: auto;
    }

    .issues-header {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      color: #9ca3af;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
    }

    .issue-count {
      background: #f59e0b;
      color: #000;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .issue-count.none {
      background: #10b981;
    }

    .issues-list {
      padding: 8px 24px;
    }

    .issue-item {
      padding: 8px 12px;
      margin: 4px 0;
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid #f59e0b;
      border-radius: 4px;
      font-size: 13px;
      color: #d1d5db;
    }

    .issue-item.critical {
      background: rgba(239, 68, 68, 0.1);
      border-left-color: #ef4444;
    }

    .issue-item .fix-note {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 20px 24px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-approve {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }

    .btn-approve:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .btn-reject {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    .btn-reject:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #9ca3af;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    .btn-change {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
    }

    .btn-change:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    /* Request Changes inline form */
    .change-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding: 0 24px;
    }

    .change-form.visible {
      display: flex;
    }

    .change-form textarea {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      padding: 10px 14px;
      resize: vertical;
      min-height: 70px;
      font-family: inherit;
    }

    .change-form textarea:focus {
      outline: none;
      border-color: #f59e0b;
    }

    .change-form .form-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* Gate label in header */
    .gate-label {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .gate-label.gate1 {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
      border: 1px solid rgba(102, 126, 234, 0.4);
    }

    .gate-label.gate2 {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    /* Loading State */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(102, 126, 234, 0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Complete State */
    .complete-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
    }

    .complete-icon {
      font-size: 72px;
    }

    .complete-title {
      font-size: 28px;
      font-weight: 700;
    }

    .complete-urls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .url-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    .url-item a {
      color: #667eea;
      text-decoration: none;
    }

    .url-item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Loading State -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Loading preview...</p>
    </div>
  </div>

  <script>
    // State
    let previewData = null;
    let workflowId = null;

    // DOM Elements
    const app = document.getElementById('app');
    const loading = document.getElementById('loading');

    // Listen for preview data from main process (gate determined by message.type)
    if (window.api && window.api.onPreviewData) {
      window.api.onPreviewData((data) => {
        console.log('Preview data received:', data);
        workflowId = data.workflow_id;
        const preview = data.preview || data;
        previewData = preview;

        if (data.type === 'awaiting_deploy_approval') {
          renderGate2Preview(preview);
        } else {
          // awaiting_code_approval or legacy approval_required
          renderGate1Preview(preview);
        }
      });
    }

    // Gate 2 fires while window is already open (preview window was showing Gate 1)
    if (window.api && window.api.onDeployApprovalRequired) {
      window.api.onDeployApprovalRequired((data) => {
        console.log('Deploy approval required:', data);
        workflowId = data.workflow_id;
        renderGate2Preview(data.preview || data);
      });
    }

    // Listen for workflow completion
    if (window.api && window.api.onWorkflowComplete) {
      window.api.onWorkflowComplete((data) => {
        console.log('Workflow complete:', data);
        renderComplete(data.result);
      });
    }

    // ======================================================================
    // GATE 1 — Code review (before GitHub push)
    // ======================================================================
    function renderGate1Preview(data) {
      const score = data.audit_score != null ? data.audit_score : (data.audit_result?.score || 0);
      const threshold = data.audit_result?.threshold || 0.95;
      const passed = score >= threshold;
      const issues = data.audit_result?.issues || [];
      const figmaUrl = data.figma_url || '';
      const projectPath = data.project_path || '';
      const generatedFiles = data.generated_files || [];

      let figmaContent;
      if (data.figma_screenshot) {
        figmaContent = `<img class="preview-image" src="${formatImageSrc(data.figma_screenshot)}" alt="Figma Design" />`;
      } else {
        figmaContent = `
          <div class="placeholder">
            <div class="placeholder-icon">🎨</div>
            <p style="margin-bottom:10px;">Figma screenshot not captured</p>
            <p style="font-size:12px;color:#6b7280;margin-bottom:16px;">
              API rate limit hit — screenshot skipped to keep workflow moving
            </p>
            ${figmaUrl ? `<a href="${figmaUrl}" target="_blank" style="
              display:inline-block;padding:8px 18px;background:#667eea;color:#fff;
              border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;">
              Open in Figma
            </a>` : ''}
          </div>`;
      }

      let renderedContent;
      if (data.rendered_screenshot) {
        renderedContent = `<img class="preview-image" src="${formatImageSrc(data.rendered_screenshot)}" alt="Generated Website" />`;
      } else {
        renderedContent = `
          <div class="placeholder">
            <div class="placeholder-icon">💻</div>
            <p style="margin-bottom:10px;">Render screenshot not captured</p>
            <p style="font-size:12px;color:#6b7280;margin-bottom:8px;">
              Dev server render skipped — code was still generated successfully
            </p>
            ${projectPath ? `<p style="font-size:11px;color:#4b5563;word-break:break-all;margin-bottom:14px;padding:0 16px;">
              ${projectPath}
            </p>` : ''}
            <p style="font-size:12px;color:#9ca3af;">
              You can still approve to proceed — the code is ready
            </p>
          </div>`;
      }

      app.innerHTML = `
        <div class="header">
          <h1><span>GodComet</span> Code Review <span class="gate-label gate1">Gate 1</span></h1>
          <div class="score-badge">
            ${figmaUrl ? `<a href="${figmaUrl}" target="_blank" style="font-size:13px;color:#667eea;text-decoration:none;margin-right:8px;">Open Figma ↗</a>` : ''}
            <div class="score ${passed ? 'pass' : 'fail'}">${(score * 100).toFixed(0)}%</div>
            <div class="threshold">Threshold: ${(threshold * 100).toFixed(0)}%</div>
          </div>
        </div>

        <div class="preview-container">
          <div class="preview-panel">
            <div class="panel-header">
              <div class="label"><span>🎨</span><span>Figma Original</span></div>
            </div>
            <div class="preview-image-container">${figmaContent}</div>
          </div>
          <div class="preview-panel">
            <div class="panel-header">
              <div class="label"><span>💻</span><span>Generated Website</span></div>
              ${generatedFiles.length ? `<span style="font-size:12px;color:#6b7280;">${generatedFiles.length} files</span>` : ''}
            </div>
            <div class="preview-image-container">${renderedContent}</div>
          </div>
        </div>

        <div class="issues-panel">
          <div class="issues-header">
            <span>Auto-detected Issues</span>
            <span class="issue-count ${issues.length === 0 ? 'none' : ''}">${issues.length}</span>
          </div>
          <div class="issues-list">
            ${issues.length === 0
              ? '<div style="color: #10b981; padding: 8px 0;">No issues detected! Design matches perfectly.</div>'
              : issues.map(issue => `
                  <div class="issue-item ${issue.severity === 'critical' ? 'critical' : ''}">
                    ${issue.element || issue.type || ''}: ${issue.description || issue.fix || ''}
                    <div class="fix-note">Will auto-fix on retry</div>
                  </div>
                `).join('')
            }
          </div>
        </div>

        <div class="action-bar" id="actionBar" style="flex-direction:column;align-items:center;gap:12px;">
          <div style="display:flex;gap:12px;justify-content:center;">
            <button class="btn btn-approve" onclick="handleCodeApprove()">
              Approve Code &rarr;
            </button>
            <button class="btn btn-change" onclick="toggleChangeForm()">
              Request Changes
            </button>
            <button class="btn btn-reject" onclick="handleCodeReject()">
              Reject &amp; Retry
            </button>
            <button class="btn btn-secondary" onclick="handleCancel()">
              Cancel
            </button>
          </div>
          <div class="change-form" id="changeForm">
            <textarea id="changeInstruction" placeholder="Describe what needs to be changed (e.g. 'make the header font larger, use blue for buttons')"></textarea>
            <div class="form-row">
              <button class="btn btn-secondary" onclick="toggleChangeForm()" style="padding:8px 20px;font-size:13px;">
                Cancel
              </button>
              <button class="btn btn-change" onclick="handleCodeChangeRequest()" style="padding:8px 20px;font-size:13px;">
                Submit Changes
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ======================================================================
    // GATE 2 — Deploy approval (after GitHub push)
    // ======================================================================
    function renderGate2Preview(data) {
      const githubUrl = data.github_url || '';
      const repoName = data.repo_name || '';
      const projectPath = data.project_path || '';
      const score = data.audit_score != null ? data.audit_score : 0;

      app.innerHTML = `
        <div class="header">
          <h1><span>GodComet</span> Deploy Approval <span class="gate-label gate2">Gate 2</span></h1>
          <div class="score-badge">
            ${score ? `<div class="score ${score >= 0.7 ? 'pass' : 'fail'}">${(score * 100).toFixed(0)}%</div>` : ''}
          </div>
        </div>

        <div class="preview-container" style="align-items:center;justify-content:center;">
          <div style="text-align:center;padding:40px;max-width:600px;">
            <div style="font-size:56px;margin-bottom:20px;">🚀</div>
            <h2 style="font-size:22px;font-weight:700;margin-bottom:12px;color:#fff;">
              Code pushed to GitHub successfully!
            </h2>
            <p style="color:#9ca3af;font-size:15px;margin-bottom:24px;line-height:1.6;">
              Your generated project is now on GitHub. Do you want to deploy it to Vercel (live website)?
            </p>

            ${githubUrl ? `
              <div style="margin-bottom:24px;">
                <a href="${githubUrl}" target="_blank" style="
                  display:inline-flex;align-items:center;gap:8px;
                  padding:10px 22px;background:rgba(255,255,255,0.07);
                  border:1px solid rgba(255,255,255,0.15);
                  border-radius:8px;color:#fff;text-decoration:none;font-size:14px;font-weight:500;">
                  View on GitHub: ${repoName || githubUrl}
                </a>
              </div>
            ` : ''}

            ${projectPath ? `
              <p style="font-size:11px;color:#4b5563;word-break:break-all;">
                ${projectPath}
              </p>
            ` : ''}
          </div>
        </div>

        <div class="action-bar" id="actionBar">
          <button class="btn btn-approve" onclick="handleDeployApprove()">
            Deploy to Vercel
          </button>
          <button class="btn btn-secondary" onclick="handleDeployReject()">
            Skip Deploy
          </button>
          <button class="btn btn-secondary" onclick="handleCancel()">
            Cancel
          </button>
        </div>
      `;
    }

    function renderComplete(result) {
      app.innerHTML = `
        <div class="complete-overlay">
          <div class="complete-icon">${result.success ? '🎉' : '❌'}</div>
          <h1 class="complete-title">${result.success ? 'Deployment Complete!' : 'Deployment Failed'}</h1>

          ${result.success ? `
            <div class="complete-urls">
              ${result.github_url ? `
                <div class="url-item">
                  <span>GitHub:</span>
                  <a href="${result.github_url}" target="_blank">${result.github_url}</a>
                </div>
              ` : ''}
              ${result.vercel_url ? `
                <div class="url-item">
                  <span>Live Site:</span>
                  <a href="${result.vercel_url}" target="_blank">${result.vercel_url}</a>
                </div>
              ` : ''}
            </div>
          ` : `
            <p style="color: #ef4444;">${result.error || 'Unknown error occurred'}</p>
          `}

          <button class="btn btn-secondary" onclick="handleClose()" style="margin-top: 20px;">
            Close
          </button>
        </div>
      `;
    }

    function formatImageSrc(src) {
      if (!src) return '';
      if (src.startsWith('data:')) return src;
      if (src.length > 100 && !src.includes('/') && !src.includes('\\')) {
        return `data:image/png;base64,${src}`;
      }
      if (src.includes('\\') || src.startsWith('/')) {
        return `file://${src.replace(/\\/g, '/')}`;
      }
      return src;
    }

    // ======================================================================
    // Action handlers — Gate 1
    // ======================================================================
    function toggleChangeForm() {
      const form = document.getElementById('changeForm');
      if (form) {
        form.classList.toggle('visible');
        if (form.classList.contains('visible')) {
          document.getElementById('changeInstruction').focus();
        }
      }
    }

    async function handleCodeApprove() {
      if (!workflowId) return;
      setActionBarLoading('Reviewing code — pushing to GitHub...');
      try {
        await window.api.codeApproveWorkflow(workflowId);
      } catch (error) {
        console.error('Code approval failed:', error);
        alert('Code approval failed: ' + error.message);
      }
    }

    async function handleCodeReject() {
      if (!workflowId) return;
      setActionBarLoading('Regenerating with auto-fixes...');
      try {
        await window.api.codeRejectWorkflow(workflowId);
      } catch (error) {
        console.error('Code rejection failed:', error);
        alert('Code rejection failed: ' + error.message);
      }
    }

    async function handleCodeChangeRequest() {
      if (!workflowId) return;
      const instruction = document.getElementById('changeInstruction')?.value?.trim();
      if (!instruction) {
        alert('Please describe what changes you want.');
        return;
      }
      setActionBarLoading('Sending change request — regenerating...');
      try {
        await window.api.codeChangeRequest(workflowId, instruction);
      } catch (error) {
        console.error('Change request failed:', error);
        alert('Change request failed: ' + error.message);
      }
    }

    // ======================================================================
    // Action handlers — Gate 2
    // ======================================================================
    async function handleDeployApprove() {
      if (!workflowId) return;
      setActionBarLoading('Deploying to Vercel...');
      try {
        await window.api.deployApproveWorkflow(workflowId);
      } catch (error) {
        console.error('Deploy approval failed:', error);
        alert('Deploy approval failed: ' + error.message);
      }
    }

    async function handleDeployReject() {
      if (!workflowId) return;
      setActionBarLoading('Skipping Vercel deploy...');
      try {
        await window.api.deployRejectWorkflow(workflowId);
      } catch (error) {
        console.error('Deploy skip failed:', error);
        alert('Deploy skip failed: ' + error.message);
      }
    }

    // ======================================================================
    // Shared helpers
    // ======================================================================
    function setActionBarLoading(message) {
      const actionBar = document.getElementById('actionBar');
      if (actionBar) {
        actionBar.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;color:#10b981;">
            <div class="spinner" style="width:24px;height:24px;"></div>
            <span>${message}</span>
          </div>
        `;
      }
    }

    async function handleCancel() {
      if (workflowId) {
        try {
          await window.api.cancelWorkflow(workflowId);
        } catch (error) {
          console.error('Cancel failed:', error);
        }
      }
      handleClose();
    }

    async function handleClose() {
      if (window.api && window.api.closePreview) {
        await window.api.closePreview();
      }
    }

    // Hide loading after a short delay if no data received
    setTimeout(() => {
      if (!previewData) {
        loading.innerHTML = `
          <div class="placeholder">
            <div class="placeholder-icon">⏳</div>
            <p>Waiting for preview data...</p>
            <p style="font-size:12px;color:#6b7280;margin-top:8px;">Start a Figma workflow to see the preview</p>
          </div>
        `;
      }
    }, 3000);
  </script>
</body>
</html>
