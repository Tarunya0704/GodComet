<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GodComet Preview - Figma vs Generated</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 span {
      color: #667eea;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .score {
      font-size: 24px;
      font-weight: 700;
    }

    .score.pass {
      color: #10b981;
    }

    .score.fail {
      color: #f59e0b;
    }

    .threshold {
      font-size: 14px;
      color: #9ca3af;
    }

    /* Preview Split View */
    .preview-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .preview-panel:last-child {
      border-right: none;
    }

    .panel-header {
      padding: 12px 20px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
      font-weight: 500;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header .label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-image-container {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
    }

    .preview-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .placeholder {
      color: #6b7280;
      text-align: center;
    }

    .placeholder-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Issues Panel */
    .issues-panel {
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.1);
      max-height: 200px;
      overflow-y: auto;
    }

    .issues-header {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      color: #9ca3af;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
    }

    .issue-count {
      background: #f59e0b;
      color: #000;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .issue-count.none {
      background: #10b981;
    }

    .issues-list {
      padding: 8px 24px;
    }

    .issue-item {
      padding: 8px 12px;
      margin: 4px 0;
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid #f59e0b;
      border-radius: 4px;
      font-size: 13px;
      color: #d1d5db;
    }

    .issue-item.critical {
      background: rgba(239, 68, 68, 0.1);
      border-left-color: #ef4444;
    }

    .issue-item .fix-note {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 20px 24px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-approve {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }

    .btn-approve:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .btn-reject {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    .btn-reject:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #9ca3af;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    /* Loading State */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(102, 126, 234, 0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Complete State */
    .complete-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
    }

    .complete-icon {
      font-size: 72px;
    }

    .complete-title {
      font-size: 28px;
      font-weight: 700;
    }

    .complete-urls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .url-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    .url-item a {
      color: #667eea;
      text-decoration: none;
    }

    .url-item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Loading State -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Loading preview...</p>
    </div>
  </div>

  <script>
    // State
    let previewData = null;
    let workflowId = null;

    // DOM Elements
    const app = document.getElementById('app');
    const loading = document.getElementById('loading');

    // Listen for preview data from main process
    if (window.api && window.api.onPreviewData) {
      window.api.onPreviewData((data) => {
        console.log('Preview data received:', data);
        // Data may be the full WebSocket message or just the preview object
        const preview = data.preview || data;
        workflowId = data.workflow_id || preview.workflow_id;
        previewData = preview;
        renderPreview(preview);
      });
    }

    // Listen for workflow completion
    if (window.api && window.api.onWorkflowComplete) {
      window.api.onWorkflowComplete((data) => {
        console.log('Workflow complete:', data);
        renderComplete(data.result);
      });
    }

    function renderPreview(data) {
      const score = data.audit_result?.score || 0;
      const threshold = data.audit_result?.threshold || 0.95;
      const passed = score >= threshold;
      const issues = data.audit_result?.issues || [];

      app.innerHTML = `
        <div class="header">
          <h1><span>GodComet</span> Preview</h1>
          <div class="score-badge">
            <div class="score ${passed ? 'pass' : 'fail'}">${(score * 100).toFixed(0)}%</div>
            <div class="threshold">Threshold: ${(threshold * 100).toFixed(0)}%</div>
          </div>
        </div>

        <div class="preview-container">
          <div class="preview-panel">
            <div class="panel-header">
              <div class="label">
                <span>🎨</span>
                <span>Figma Original</span>
              </div>
            </div>
            <div class="preview-image-container">
              ${data.figma_screenshot
                ? `<img class="preview-image" src="${formatImageSrc(data.figma_screenshot)}" alt="Figma Design" />`
                : `<div class="placeholder"><div class="placeholder-icon">🎨</div><p>Figma screenshot not available</p></div>`
              }
            </div>
          </div>

          <div class="preview-panel">
            <div class="panel-header">
              <div class="label">
                <span>💻</span>
                <span>Generated Website</span>
              </div>
            </div>
            <div class="preview-image-container">
              ${data.rendered_screenshot
                ? `<img class="preview-image" src="${formatImageSrc(data.rendered_screenshot)}" alt="Generated Website" />`
                : `<div class="placeholder"><div class="placeholder-icon">💻</div><p>Rendered screenshot not available</p></div>`
              }
            </div>
          </div>
        </div>

        <div class="issues-panel">
          <div class="issues-header">
            <span>Auto-detected Issues</span>
            <span class="issue-count ${issues.length === 0 ? 'none' : ''}">${issues.length}</span>
          </div>
          <div class="issues-list">
            ${issues.length === 0
              ? '<div style="color: #10b981; padding: 8px 0;">No issues detected! Design matches perfectly.</div>'
              : issues.map(issue => `
                  <div class="issue-item ${issue.severity === 'critical' ? 'critical' : ''}">
                    ${issue.element || issue.type}: ${issue.description || issue.fix}
                    <div class="fix-note">Will auto-fix on retry</div>
                  </div>
                `).join('')
            }
          </div>
        </div>

        <div class="action-bar">
          <button class="btn btn-approve" onclick="handleApprove()">
            ✅ Approve & Deploy
          </button>
          <button class="btn btn-reject" onclick="handleReject()">
            🔄 Reject & Retry
          </button>
          <button class="btn btn-secondary" onclick="handleCancel()">
            Cancel
          </button>
        </div>
      `;
    }

    function renderComplete(result) {
      app.innerHTML = `
        <div class="complete-overlay">
          <div class="complete-icon">${result.success ? '🎉' : '❌'}</div>
          <h1 class="complete-title">${result.success ? 'Deployment Complete!' : 'Deployment Failed'}</h1>

          ${result.success ? `
            <div class="complete-urls">
              ${result.github_url ? `
                <div class="url-item">
                  <span>🐙</span>
                  <span>GitHub:</span>
                  <a href="${result.github_url}" target="_blank">${result.github_url}</a>
                </div>
              ` : ''}
              ${result.vercel_url ? `
                <div class="url-item">
                  <span>🌐</span>
                  <span>Live Site:</span>
                  <a href="${result.vercel_url}" target="_blank">${result.vercel_url}</a>
                </div>
              ` : ''}
            </div>
          ` : `
            <p style="color: #ef4444;">${result.error || 'Unknown error occurred'}</p>
          `}

          <button class="btn btn-secondary" onclick="handleClose()" style="margin-top: 20px;">
            Close
          </button>
        </div>
      `;
    }

    function formatImageSrc(src) {
      if (!src) return '';
      // If it's a base64 string
      if (src.startsWith('data:')) return src;
      // If it's a base64 without prefix
      if (src.length > 100 && !src.includes('/')) {
        return `data:image/png;base64,${src}`;
      }
      // If it's a file path, convert to file:// URL
      if (src.includes('\\') || src.includes('/')) {
        return `file://${src.replace(/\\/g, '/')}`;
      }
      return src;
    }

    async function handleApprove() {
      if (!workflowId) return;

      try {
        const result = await window.api.approveWorkflow(workflowId);
        console.log('Approval result:', result);

        // Update UI to show deploying
        const actionBar = document.querySelector('.action-bar');
        if (actionBar) {
          actionBar.innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px; color: #10b981;">
              <div class="spinner" style="width: 24px; height: 24px;"></div>
              <span>Deploying to production...</span>
            </div>
          `;
        }
      } catch (error) {
        console.error('Approval failed:', error);
        alert('Approval failed: ' + error.message);
      }
    }

    async function handleReject() {
      if (!workflowId) return;

      try {
        const result = await window.api.rejectWorkflow(workflowId, []);
        console.log('Rejection result:', result);

        // Update UI
        const actionBar = document.querySelector('.action-bar');
        if (actionBar) {
          actionBar.innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px; color: #f59e0b;">
              <div class="spinner" style="width: 24px; height: 24px;"></div>
              <span>Regenerating with auto-fixes...</span>
            </div>
          `;
        }
      } catch (error) {
        console.error('Rejection failed:', error);
        alert('Rejection failed: ' + error.message);
      }
    }

    async function handleCancel() {
      if (workflowId) {
        try {
          await window.api.cancelWorkflow(workflowId);
        } catch (error) {
          console.error('Cancel failed:', error);
        }
      }
      handleClose();
    }

    async function handleClose() {
      if (window.api && window.api.closePreview) {
        await window.api.closePreview();
      }
    }

    // Hide loading after a short delay if no data received
    setTimeout(() => {
      if (!previewData) {
        loading.innerHTML = `
          <div class="placeholder">
            <div class="placeholder-icon">⏳</div>
            <p>Waiting for preview data...</p>
            <p style="font-size: 12px; color: #6b7280; margin-top: 8px;">Start a Figma workflow to see the preview</p>
          </div>
        `;
      }
    }, 3000);
  </script>
</body>
</html>
